[pytest]
# Collect only the test directory.  Without an explicit scope pytest resolves
# collection from the invocation directory, and at the repository root the root
# package module (``__init__.py``, a relative import with no parent package) is
# collected as a test and dies with ImportError — which is what made a
# measurement irreproducible at a parent commit (ROI-S14, design D10).
testpaths = tests
